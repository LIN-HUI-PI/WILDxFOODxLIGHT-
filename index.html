<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>門市限定・撒野計劃</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-user-select: none; user-select: none; }
    body {
      background: radial-gradient(circle at center, #1b263b 0%, #0d1b2a 100%);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      height: 100vh;
      overflow: hidden;
      padding: 24px 16px;
    }

    .top-bar { width: 100%; max-width: 320px; text-align: center; }
    .top-bar h1 { font-size: 1.25rem; color: #48cae4; margin-bottom: 4px; letter-spacing: 1px; }
    .status-pill {
      display: inline-block;
      font-size: 0.8rem;
      background: rgba(255,255,255,0.1);
      padding: 4px 12px;
      border-radius: 20px;
      color: #90e0ef;
    }

    /* 雷達視窗 */
    .radar-wrapper {
      position: relative;
      width: 320px;
      height: 360px;
      background: radial-gradient(circle, #1e3d59 0%, #17252a 80%);
      border: 3px solid #48cae4;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 0 25px rgba(72, 202, 228, 0.2);
    }

    #gameCanvas { width: 100%; height: 100%; touch-action: none; display: block; position: absolute; inset: 0; z-index: 2; }

    /* 真實動態怪獸影片層 (圓形懸浮) */
    #monsterVideo {
      position: absolute;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
      display: none;
      z-index: 1;
      pointer-events: none;
      box-shadow: 0 0 15px rgba(255,255,255,0.4);
      border: 2px solid rgba(255,255,255,0.8);
    }

    .radar-scanner {
      position: absolute;
      inset: 0;
      border-radius: 20px;
      background: conic-gradient(from 0deg, rgba(72, 202, 228, 0.35) 0deg, transparent 60deg);
      animation: scan 2s linear infinite;
      pointer-events: none;
      display: none;
      z-index: 3;
    }
    @keyframes scan {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .tip-text { font-size: 0.85rem; color: #adb5bd; margin-bottom: 8px; text-align: center; }
