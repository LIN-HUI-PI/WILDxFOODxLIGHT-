<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>門市限定・撒野計劃</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    body {
      background-color: #0b192c;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 24px 16px;
      overflow: hidden;
    }

    /* 頂部標題與警示條 */
    .header-area {
      width: 100%;
      max-width: 380px;
      text-align: center;
    }
    .header-title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 12px;
      color: #38bdf8;
    }
    .alert-banner {
      background: linear-gradient(90deg, #ef4444, #f97316);
      color: #ffffff;
      font-size: 13px;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: 9999px;
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.35);
      animation: pulse 1.8s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.02); opacity: 0.9; }
    }

    /* 雷達主畫布區域 */
    .radar-container {
      position: relative;
      width: 320px;
      height: 320px;
      border-radius: 28px;
      border: 3px solid #38bdf8;
      background: radial-gradient(circle, #0e2a47 0%, #071322 100%);
      box-shadow: 0 0 24px rgba(56, 189, 248, 0.25);
      overflow: hidden;
      margin: auto 0;
    }

    /* 雷達同心圓背景線條 */
    .circle-1, .circle-2, .circle-3 {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      border: 1px solid rgba(56, 189, 248, 0.18);
    }
    .circle-1 { width: 90px; height: 90px; }
    .circle-2 { width: 190px; height: 190px; }
    .circle-3 { width: 280px; height: 280px; }
    .cross-line {
      position: absolute;
      top: 50%;
      left: 0;
      width: 100%;
      height: 1px;
      background: rgba(56, 189, 248, 0.15);
    }

    /* 雷達掃描扇形 */
    .scanner {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: conic-gradient(from 0deg, rgba(56, 189, 248, 0.25) 0deg, transparent 60deg, transparent 360deg);
      animation: scan 4s linear infinite;
      pointer-events: none;
    }
    @keyframes scan {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* 未知野生物件目標 (不給看是哪隻怪) */
    .target-dot {
      position: absolute;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      border: 3px solid #ffffff;
      background: rgba(255, 255, 255, 0.15);
      box-shadow: 0 0 20px #ffffff, inset 0 0 10px #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      cursor: pointer;
      animation: dotGlow 1.5s infinite alternate ease-in-out;
    }
    @keyframes dotGlow {
      0% { transform: scale(0.95); box-shadow: 0 0 12px #ffffff; }
      100% { transform: scale(1.08); box-shadow: 0 0 24px #38bdf8; }
    }

    /* 小手滑動抓取器 */
    .hand-grabber {
      position: absolute;
      width: 60px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      bottom: 24px;
      left: 130px;
      touch-action: none;
      cursor: grab;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5));
    }

    /* 底部操作指示 */
    .footer-hint {
      font-size: 14px;
      color: #94a3b8;
      letter-spacing: 1px;
      margin-bottom: 20px;
      text-align: center;
    }

    /* 彈窗／領取層 */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 999;
    }
    .modal-card {
      background: #1e293b;
      border: 2px solid #38bdf8;
      border-radius: 20px;
      padding: 24px 20px;
      width: 100%;
      max-width: 340px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
    }
    .modal-title {
      font-size: 18px;
      font-weight: 700;
      color: #38bdf8;
      margin-bottom: 12px;
    }
    .monster-badge {
      font-size: 20px;
      color: #facc15;
      font-weight: 700;
      margin-bottom: 16px;
    }
    .reward-box {
      background: #0f172a;
      border: 1px dashed #38bdf8;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
    }
    .reward-name {
      font-size: 17px;
      font-weight: 700;
      color: #4ade80;
    }
    .input-field {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #ffffff;
      font-size: 16px;
      text-align: center;
      margin-bottom: 12px;
      outline: none;
    }
    .input-field:focus {
      border-color: #38bdf8;
    }
    .submit-btn {
      width: 100%;
      padding: 12px;
      background: #38bdf8;
      color: #0b192c;
      font-size: 16px;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    /* 已領取過畫面的鎖定狀態 */
    .locked-view {
      display: none;
      width: 100%;
      max-width: 360px;
      margin: auto 0;
      background: #1e293b;
      border: 2px solid #64748b;
      border-radius: 20px;
      padding: 28px 20px;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- 頂部標題區域 -->
  <div class="header-area" id="headerArea">
    <div class="header-title">門市限定・撒野計劃</div>
    <!-- 抓取前保持神祕，絕不出現怪物名字 -->
    <div class="alert-banner" id="radarAlert">
      ⚠️ 雷達感應中：偵測到周圍訊號，快滑動捕捉！
    </div>
  </div>

  <!-- 雷達遊戲畫面 -->
  <div class="radar-container" id="radarContainer">
    <div class="circle-1"></div>
    <div class="circle-2"></div>
    <div class="circle-3"></div>
    <div class="cross-line"></div>
    <div class="scanner"></div>

    <!-- 未知的神祕光點（抓到前不透露身分） -->
    <div class="target-dot" id="targetDot" style="top: 60px; left: 45px;">
      ❓
    </div>

    <!-- 玩家滑動的小手手 -->
    <div class="hand-grabber" id="handGrabber">🖐️</div>
  </div>

  <!-- 底部提示文字 -->
  <div class="footer-hint" id="footerHint">
    按住下方小手手 🖐️，向上滑動去抓！
  </div>

  <!-- 捕捉成功後彈窗（此時才揭曉怪獸本體與兌換券） -->
  <div class="modal-overlay" id="claimModal">
    <div class="modal-card">
      <div class="modal-title">🎉 成功捕獲野生目標！</div>
      <div class="monster-badge" id="modalMonsterName">【野生物件解鎖中】</div>
      <div class="reward-box">
        <div style="font-size:13px; color:#94a3b8; margin-bottom:6px;">獲得門市專屬兌換券</div>
        <div class="reward-name" id="modalRewardName">活動折抵券</div>
      </div>
      <input type="tel" id="userPhone" class="input-field" placeholder="請輸入手機號碼 (09xxxxxxxx)" maxlength="10">
      <button class="submit-btn" id="claimBtn">確認綁定並領取</button>
      <div style="font-size:11px; color:#64748b; margin-top:8px;">每人限領一次，送出後即綁定此號碼</div>
    </div>
  </div>

  <!-- 已領取過的鎖定卡片（防重複刷券專用） -->
  <div class="locked-view" id="lockedView">
    <div style="font-size: 32px; margin-bottom: 12px;">✅</div>
    <div style="font-size: 20px; font-weight:700; color:#38bdf8; margin-bottom: 8px;">您已完成本門市活動</div>
    <p style="font-size: 13px; color: #94a3b8; margin-bottom: 20px;">同台裝置或手機門號僅限領取一次</p>
    
    <div class="reward-box" style="text-align: left;">
      <div style="font-size:12px; color:#94a3b8;">綁定手機：<span id="lockedPhone" style="color:#ffffff;">09xxxxxxxx</span></div>
      <div style="font-size:12px; color:#94a3b8; margin-top:4px;">捕獲夥伴：<span id="lockedMonster" style="color:#facc15;">-</span></div>
      <div style="font-size:14px; color:#4ade80; font-weight:700; margin-top:8px;" id="lockedReward">-</div>
    </div>

    <div style="font-size: 12px; color: #64748b;">結帳時請主動出示此畫面給門市夥伴確認</div>
  </div>

  <script>
    // 怪物清單庫（捕捉前完全隱蔽，不寫在前端標籤裡）
    const REWARD_DATABASE = [
      { name: "微笑調皮鬼・明日怪", reward: "野食光 主餐折抵 20 元券" },
      { name: "日光飽飽獸・元氣怪", reward: "美式黑咖啡 / 經典紅茶 兌換券" },
      { name: "晨光散步精靈", reward: "特製手作小點心 招待券" }
    ];

    let currentTarget = null;
    let isDragging = false;
    let startX = 0, startY = 0;
    let initLeft = 130, initBottom = 24;

    const radarContainer = document.getElementById('radarContainer');
    const targetDot = document.getElementById('targetDot');
    const handGrabber = document.getElementById('handGrabber');
    const claimModal = document.getElementById('claimModal');
    const userPhoneInput = document.getElementById('userPhone');
    const claimBtn = document.getElementById('claimBtn');
    const lockedView = document.getElementById('lockedView');
    const headerArea = document.getElementById('headerArea');
    const footerHint = document.getElementById('footerHint');

    // 1. 頁面載入：檢查本機是否已經玩過領過
    window.addEventListener('DOMContentLoaded', () => {
      const savedRecord = localStorage.getItem('yeshiguang_user_coupon');
      if (savedRecord) {
        showLockedScreen(JSON.parse(savedRecord));
      } else {
        initGame();
      }
    });

    // 2. 初始化遊戲：隨機抽怪，但雷達上方「絕對不劇透」
    function initGame() {
      currentTarget = REWARD_DATABASE[Math.floor(Math.random() * REWARD_DATABASE.length)];

      // 隨機在雷達上半部放置光點位置
      const randomX = Math.floor(Math.random() * 200) + 30;
      const randomY = Math.floor(Math.random() * 120) + 40;
      targetDot.style.left = `${randomX}px`;
      targetDot.style.top = `${randomY}px`;

      setupHandTouchControls();
    }

    // 3. 小手拖曳滑動捕捉監聽
    function setupHandTouchControls() {
      handGrabber.addEventListener('pointerdown', (e) => {
        isDragging = true;
        startX = e.clientX;
        startY = e.clientY;
        handGrabber.setPointerCapture(e.pointerId);
      });

      handGrabber.addEventListener('pointermove', (e) => {
        if (!isDragging) return;
        const deltaX = e.clientX - startX;
        const deltaY = e.clientY - startY;

        let newLeft = initLeft + deltaX;
        let newBottom = initBottom - deltaY;

        // 限制拖曳範圍在雷達內
        newLeft = Math.max(10, Math.min(250, newLeft));
        newBottom = Math.max(10, Math.min(250, newBottom));

        handGrabber.style.left = `${newLeft}px`;
        handGrabber.style.bottom = `${newBottom}px`;

        // 碰撞檢測：當小手靠近光點時完成捕捉
        checkCollision();
      });

      handGrabber.addEventListener('pointerup', () => {
        if (!isDragging) return;
        isDragging = false;
        // 未抓到時小手彈回原點
        handGrabber.style.left = `${initLeft}px`;
        handGrabber.style.bottom = `${initBottom}px`;
      });
    }

    // 檢測是否成功碰觸到光點
    function checkCollision() {
      const handRect = handGrabber.getBoundingClientRect();
      const dotRect = targetDot.getBoundingClientRect();

      const handCenterX = handRect.left + handRect.width / 2;
      const handCenterY = handRect.top + handRect.height / 2;
      const dotCenterX = dotRect.left + dotRect.width / 2;
      const dotCenterY = dotRect.top + dotRect.height / 2;

      const distance = Math.hypot(handCenterX - dotCenterX, handCenterY - dotCenterY);

      if (distance < 45) { // 碰到了！
        isDragging = false;
        onCatchSuccess();
      }
    }

    // 4. 成功捕捉：這時才揭曉怪物名字與獎項
    function onCatchSuccess() {
      targetDot.style.display = 'none';
      document.getElementById('modalMonsterName').innerText = `【${currentTarget.name}】`;
      document.getElementById('modalRewardName').innerText = currentTarget.reward;
      claimModal.style.display = 'flex';
    }

    // 5. 點擊領取按鈕：執行手機號碼驗證與防刷儲存
    claimBtn.addEventListener('click', () => {
      const phone = userPhoneInput.value.trim();

      // 手機號碼格式防呆
      if (!/^09\d{8}$/.test(phone)) {
        alert("請輸入正確的手機號碼（共10碼，例如：0912345678）");
        return;
      }

      // 檢查本機儲存的所有曾領取號碼清單
      const claimedList = JSON.parse(localStorage.getItem('yeshiguang_claimed_phones') || '[]');
      if (claimedList.includes(phone)) {
        alert("⚠️ 此手機號碼已經領取過獎項囉！無法重複領取。");
        return;
      }

      // 通過檢查：加入號碼黑名單防刷
      claimedList.push(phone);
      localStorage.setItem('yeshiguang_claimed_phones', JSON.stringify(claimedList));

      // 鎖死本機當前持有的票券紀錄
      const couponRecord = {
        phone: phone,
        monster: currentTarget.name,
        reward: currentTarget.reward,
        date: new Date().toLocaleDateString('zh-TW')
      };
      localStorage.setItem('yeshiguang_user_coupon', JSON.stringify(couponRecord));

      claimModal.style.display = 'none';
      alert(`🎉 恭喜！兌換券已成功綁定至手機號碼：${phone}`);
      showLockedScreen(couponRecord);
    });

    // 6. 鎖定畫面：隱藏雷達，固定顯示已領取的票券
    function showLockedScreen(record) {
      headerArea.style.display = 'none';
      radarContainer.style.display = 'none';
      footerHint.style.display = 'none';
      claimModal.style.display = 'none';

      document.getElementById('lockedPhone').innerText = record.phone;
      document.getElementById('lockedMonster').innerText = record.monster;
      document.getElementById('lockedReward').innerText = record.reward;
      lockedView.style.display = 'block';
    }
  </script>
</body>
</html>
